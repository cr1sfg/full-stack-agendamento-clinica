info:
  name: Cadastrar Paciente
  type: http
  seq: 5
  tags:
    - paciente-controller

http:
  method: POST
  url: "{{baseUrl}}/pacientes"
  body:
    type: json
    data: |-
      {
        "cpf": "31926203070",
        "nome": "{{$randomFullName}}",
        "dataNascimento": "2001-08-15"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
