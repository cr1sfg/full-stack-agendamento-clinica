info:
  name: Atualizar Paciente
  type: http
  seq: 2
  tags:
    - paciente-controller

http:
  method: PUT
  url: "{{baseUrl}}/pacientes/:id"
  params:
    - name: id
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "cpf": "52998224725",
        "nome": "{{$randomFullName}}",
        "dataNascimento": "1992-06-15"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/pacientes/:id"
      method: PUT
      params:
        - name: id
          value: "1"
          type: path
      body:
        type: json
        data: |-
          {
            "cpf": "52998224725",
            "nome": "Camila Ferreira",
            "dataNascimento": "1992-06-15"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 1,
            "cpf": "52998224725",
            "nome": "Camila Ferreira",
            "dataNascimento": "1992-06-15"
          }
