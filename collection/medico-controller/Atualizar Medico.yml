info:
  name: Atualizar Medico
  type: http
  seq: 1
  tags:
    - medico-controller

http:
  method: PUT
  url: "{{baseUrl}}/medicos"
  body:
    type: json
    data: |-
      {
        "id": 0,
        "crm": "",
        "nome": "",
        "especialidade": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/medicos"
      method: PUT
      body:
        type: json
        data: |-
          {
            "id": 0,
            "crm": "",
            "nome": "",
            "especialidade": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "crm": "",
            "nome": "",
            "especialidade": ""
          }
