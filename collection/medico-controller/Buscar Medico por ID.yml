info:
  name: Buscar Medico por ID
  type: http
  seq: 3
  tags:
    - medico-controller

http:
  method: GET
  url: "{{baseUrl}}/medicos/:id"
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/medicos/:id"
      method: GET
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 1,
            "crm": "EME12345/SP",
            "nome": "Dr. Rafael Martins",
            "especialidade": "Cardiologia"
          }
