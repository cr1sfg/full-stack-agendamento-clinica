info:
  name: Cadastrar Medico
  type: http
  seq: 2
  tags:
    - medico-controller

http:
  method: POST
  url: "{{baseUrl}}/medicos"
  body:
    type: json
    data: |-
      {
        "crm": "EME12345/SP",
        "nome": "{{$randomFullName}}",
        "especialidade": "Cardiologia"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/medicos"
      method: POST
      body:
        type: json
        data: |-
          {
            "crm": "EME12345/SP",
            "nome": "Dr. Rafael Martins",
            "especialidade": "Cardiologia"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 1,
            "crm": "EME12345/SP",
            "nome": "Dr. Rafael Martins",
            "especialidade": "Cardiologia"
          }
