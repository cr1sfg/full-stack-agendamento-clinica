info:
  name: Consultar Agendamento
  type: http
  seq: 2
  tags:
    - agendamento-controller

http:
  method: GET
  url: "{{baseUrl}}/agendamentos/:id"
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/agendamentos/:id"
      method: GET
      params:
        - name: id
          value: "1"
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 1,
            "data": "2027-04-12T10:30:00",
            "medico": {
              "id": 1,
              "crm": "EME12345/SP",
              "nome": "Dr. Rafael Martins",
              "especialidade": "Cardiologia"
            },
