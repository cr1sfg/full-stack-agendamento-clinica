info:
  name: Consultar Agendamento
  type: http
  seq: 2
  tags:
    - agendamento-controller

http:
  method: GET
  url: "{{baseUrl}}/agendamentos/:id"
  params:
    - name: id
      value: ""
      type: path
  auth: inherit

settings:
