info:
  name: Cadastrar Agendamento
  type: http
  seq: 1
  tags:
    - agendamento-controller

http:
  method: POST
  url: "{{baseUrl}}/agendamentos"
  body:
    type: json
    data: |-
      {
        "medicoId": 1,
        "pacienteId": 1,
        "data": "2027-04-12T10:30:00"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/agendamentos"
      method: POST
      body:
        type: json
        data: |-
          {
            "medicoId": 1,
            "pacienteId": 1,
            "data": "2027-04-12T10:30:00"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 1,
            "data": "2027-04-12T10:30:00",
            "medico": {
              "id": 1,
              "crm": "EME12345/SP",
              "nome": "Dr. Rafael Martins",
              "especialidade": "Cardiologia"
            },
            "paciente": {
              "id": 1,
              "cpf": "52998224725",
              "nome": "Camila Ferreira",
              "dataNascimento": "1992-06-15"
            }
          }
